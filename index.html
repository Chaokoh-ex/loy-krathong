<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ขอบคุณที่มาร่วมลอยกระทง · TCC</title>
<meta name="theme-color" content="#0A1130">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#0A1130;color:#FFF6E3;font-family:'Sarabun',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
.moon{position:fixed;top:-60px;right:-60px;width:240px;height:240px;border-radius:50%;background:#FFF1C2;box-shadow:0 0 120px 50px rgba(255,240,196,.25)}
.card{position:relative;max-width:440px}
img{height:44px;background:#fff;border-radius:10px;padding:5px 9px}
h1{font-family:'Mitr',sans-serif;font-weight:500;font-size:30px;line-height:1.35;color:#FFF3C4;margin-top:22px}
p{font-size:18px;line-height:1.6;color:#D9D3C2;margin-top:12px}
.gold{font-family:'Mitr',sans-serif;color:#F2B544;font-size:20px;margin-top:20px}
</style>
</head>
<body>
<div class="moon" aria-hidden="true"></div>
<main class="card">
<img src="assets/logos/tcc.png" alt="TCC">
<h1>งานลอยกระทงออนไลน์ปีนี้จบลงแล้ว</h1>
<p>ขอบคุณทุกคนที่มาร่วมลอยกระทงและส่งคำอธิษฐานดี ๆ ด้วยกัน<br>ขอให้ทุกคำอธิษฐานเป็นจริง</p>
<p class="gold">จาก TCC</p>
</main>
</body>
</html>
