<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ลอยกระทงออนไลน์ TCC 2569</title>
<meta name="theme-color" content="#0B1230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="-100 -124 590 844" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#070B22"/><stop offset=".55" stop-color="#121C46"/><stop offset="1" stop-color="#22306A"/>
      </linearGradient>
      <linearGradient id="water" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#0E2350"/><stop offset="1" stop-color="#050C24"/>
      </linearGradient>
      <radialGradient id="moonGlow"><stop offset=".55" stop-color="#FFF6D5" stop-opacity=".35"/><stop offset="1" stop-color="#FFF6D5" stop-opacity="0"/></radialGradient>
      <clipPath id="bbClip"><rect x="22" y="232" width="104" height="80" rx="3"/></clipPath>
    </defs>

    <rect x="-900" y="-900" width="2190" height="780" fill="#070B22"/><rect x="-900" y="-124" width="2190" height="580" fill="url(#sky)"/>
    <g id="stars" fill="#fff"></g>

    <circle cx="300" cy="96" r="78" fill="url(#moonGlow)"/>
    <circle cx="300" cy="96" r="36" fill="#FFF3C4"/>
    <circle cx="290" cy="88" r="6" fill="#F3E3A8" opacity=".6"/><circle cx="312" cy="106" r="4" fill="#F3E3A8" opacity=".6"/>

    <!-- far city -->
    <g fill="#18224F">
      <rect x="-700" y="320" width="120" height="126"/><rect x="-560" y="280" width="70" height="166"/><rect x="-470" y="350" width="90" height="96"/><rect x="-360" y="300" width="60" height="146"/><rect x="-280" y="340" width="100" height="106"/><rect x="-160" y="310" width="50" height="136"/><rect x="-96" y="290" width="56" height="156"/>
      <rect x="400" y="320" width="60" height="126"/><rect x="470" y="270" width="70" height="176"/><rect x="560" y="340" width="110" height="106"/><rect x="690" y="300" width="60" height="146"/><rect x="770" y="350" width="120" height="96"/><rect x="910" y="310" width="80" height="136"/>

      <rect x="340" y="300" width="50" height="146"/><rect x="318" y="350" width="26" height="96"/>
    </g>
    <g fill="#3A4A86" opacity=".7">
      <rect x="6" y="340" width="4" height="4"/><rect x="18" y="352" width="4" height="4"/><rect x="28" y="370" width="4" height="4"/><rect x="350" y="312" width="4" height="4"/><rect x="366" y="330" width="4" height="4"/><rect x="376" y="360" width="4" height="4"/>
    </g>

    <!-- TCC building -->
    <g id="building">
      <rect x="172" y="168" width="140" height="278" fill="#1B2550"/>
      <rect x="296" y="190" width="40" height="256" fill="#2A3360"/>
      <g fill="#FFD27A" opacity=".85">
        <rect x="186" y="196" width="112" height="22"/><rect x="186" y="236" width="112" height="22"/>
        <rect x="186" y="276" width="112" height="22"/><rect x="186" y="316" width="112" height="22"/>
        <rect x="186" y="356" width="112" height="22"/>
      </g>
      <g stroke="#3A2E1E" stroke-width="1.2" opacity=".6">
        <line x1="208" y1="196" x2="208" y2="378"/><line x1="232" y1="196" x2="232" y2="378"/><line x1="256" y1="196" x2="256" y2="378"/><line x1="280" y1="196" x2="280" y2="378"/>
      </g>
      <g fill="none" stroke-linecap="round">
        <g stroke="#B58556" stroke-width="5">
          <path d="M160 186 C190 172 230 196 262 182 S312 176 316 184"/>
          <path d="M156 226 C190 210 232 236 264 222 S312 214 318 224"/>
          <path d="M152 266 C188 250 234 276 266 262 S312 254 318 264"/>
          <path d="M150 306 C188 290 236 316 268 302 S314 294 318 304"/>
          <path d="M152 346 C190 330 236 356 268 342 S314 334 318 344"/>
          <path d="M158 386 C192 372 236 394 266 382 S312 376 318 384"/>
        </g>
        <g stroke="#7A5634" stroke-width="2">
          <path d="M160 193 C190 179 230 203 262 189 S312 183 316 191"/>
          <path d="M156 233 C190 217 232 243 264 229 S312 221 318 231"/>
          <path d="M152 273 C188 257 234 283 266 269 S312 261 318 271"/>
          <path d="M150 313 C188 297 236 323 268 309 S314 301 318 311"/>
          <path d="M152 353 C190 337 236 363 268 349 S314 341 318 351"/>
        </g>
      </g>
      <rect x="226" y="176" width="9" height="270" fill="#E9E6DE"/>
      <rect x="296" y="200" width="7" height="246" fill="#D9D5CC"/>
      <path d="M150 404 C186 394 250 398 312 400 L312 410 C250 408 186 404 150 414 Z" fill="#9C7449"/>
      <rect x="186" y="414" width="98" height="32" fill="#FFCF73"/>
      <g stroke="#7A5634" stroke-width="1.5"><line x1="210" y1="414" x2="210" y2="446"/><line x1="250" y1="414" x2="250" y2="446"/></g>
      <rect x="244" y="420" width="16" height="7" rx="1" fill="#1D4F3A"/>
    </g>

    <!-- big tree -->
    <g id="tree">
      <path d="M318 446 C320 400 314 360 322 318 M320 370 C330 350 344 340 352 330 M318 350 C306 334 296 326 288 318" stroke="#3B2A1A" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g fill="#1E3B1C">
        <ellipse cx="322" cy="292" rx="44" ry="30"/><ellipse cx="290" cy="306" rx="26" ry="18"/><ellipse cx="356" cy="314" rx="30" ry="20"/><ellipse cx="338" cy="270" rx="28" ry="20"/>
      </g>
      <g fill="#2C5426" opacity=".8"><ellipse cx="312" cy="284" rx="22" ry="12"/><ellipse cx="350" cy="300" rx="16" ry="9"/></g>
    </g>

    <!-- billboard -->
    <g id="billboard">
      <rect x="44" y="330" width="6" height="116" fill="#3A3A46"/><rect x="98" y="330" width="6" height="116" fill="#3A3A46"/>
      <rect x="14" y="222" width="120" height="122" rx="6" fill="#0A0F2A" stroke="#F2B544" stroke-width="2.5"/>
      <rect x="22" y="232" width="104" height="80" rx="3" fill="#FFFDF6"/>
      <g id="bbProducts" clip-path="url(#bbClip)"></g>
      <rect x="22" y="316" width="104" height="22" rx="3" fill="#FFFDF6"/>
      <g id="bbLogos"></g>
      <g fill="#FFE29A"><circle cx="30" cy="219" r="2.5"/><circle cx="74" cy="219" r="2.5"/><circle cx="118" cy="219" r="2.5"/></g>
    </g>

    <!-- bank -->
    <rect x="-900" y="440" width="2190" height="10" fill="#101A12"/>

    <!-- palms -->
    <g id="palms">
      <g transform="translate(150 446)">
        <path d="M0 0 Q4 -50 14 -96" stroke="#4A3320" stroke-width="5" fill="none"/>
        <g transform="translate(14 -96)" fill="#24461A">
          <path d="M0 0 q-34 -6 -50 18 q26 -24 50 -18z"/><path d="M0 0 q34 -12 54 8 q-28 -18 -54 -8z"/>
          <path d="M0 0 q-12 -32 -40 -38 q28 10 40 38z"/><path d="M0 0 q18 -32 46 -32 q-32 6 -46 32z"/>
          <path d="M0 0 q-28 8 -40 36 q14 -30 40 -36z"/><circle cx="-2" cy="4" r="4" fill="#5B4120"/><circle cx="4" cy="5" r="4" fill="#5B4120"/>
        </g>
      </g>
      <g transform="translate(372 446)">
        <path d="M0 0 Q-6 -60 -18 -120" stroke="#4A3320" stroke-width="5" fill="none"/>
        <g transform="translate(-18 -120)" fill="#24461A">
          <path d="M0 0 q-34 -6 -50 18 q26 -24 50 -18z"/><path d="M0 0 q34 -12 54 8 q-28 -18 -54 -8z"/>
          <path d="M0 0 q-12 -32 -40 -38 q28 10 40 38z"/><path d="M0 0 q18 -32 46 -32 q-32 6 -46 32z"/>
          <path d="M0 0 q-28 8 -40 36 q14 -30 40 -36z"/><circle cx="-2" cy="4" r="4" fill="#5B4120"/><circle cx="4" cy="5" r="4" fill="#5B4120"/>
        </g>
      </g>
      <g transform="translate(6 446)">
        <path d="M0 0 Q6 -40 18 -78" stroke="#4A3320" stroke-width="4" fill="none"/>
        <g transform="translate(18 -78) scale(.8)" fill="#24461A">
          <path d="M0 0 q-34 -6 -50 18 q26 -24 50 -18z"/><path d="M0 0 q34 -12 54 8 q-28 -18 -54 -8z"/>
          <path d="M0 0 q-12 -32 -40 -38 q28 10 40 38z"/><path d="M0 0 q18 -32 46 -32 q-32 6 -46 32z"/>
        </g>
      </g>
      <g transform="translate(-60 446)">
        <path d="M0 0 Q-4 -56 -14 -110" stroke="#4A3320" stroke-width="5" fill="none"/>
        <g transform="translate(-14 -110)" fill="#24461A">
          <path d="M0 0 q-34 -6 -50 18 q26 -24 50 -18z"/><path d="M0 0 q34 -12 54 8 q-28 -18 -54 -8z"/>
          <path d="M0 0 q-12 -32 -40 -38 q28 10 40 38z"/><path d="M0 0 q18 -32 46 -32 q-32 6 -46 32z"/><path d="M0 0 q-28 8 -40 36 q14 -30 40 -36z"/>
        </g>
      </g>
      <g transform="translate(450 446)">
        <path d="M0 0 Q6 -46 16 -92" stroke="#4A3320" stroke-width="5" fill="none"/>
        <g transform="translate(16 -92)" fill="#24461A">
          <path d="M0 0 q-34 -6 -50 18 q26 -24 50 -18z"/><path d="M0 0 q34 -12 54 8 q-28 -18 -54 -8z"/>
          <path d="M0 0 q-12 -32 -40 -38 q28 10 40 38z"/><path d="M0 0 q18 -32 46 -32 q-32 6 -46 32z"/><path d="M0 0 q-28 8 -40 36 q14 -30 40 -36z"/>
        </g>
      </g>
    </g>

    <!-- river -->
    <rect x="-900" y="448" width="2190" height="600" fill="#050C24"/><rect x="-900" y="448" width="2190" height="272" fill="url(#water)"/>
    <g opacity=".35">
      <rect x="186" y="452" width="98" height="40" fill="#FFCF73" opacity=".35"/>
      <rect x="194" y="496" width="80" height="4" fill="#FFCF73" opacity=".5"/><rect x="200" y="508" width="66" height="3" fill="#FFCF73" opacity=".4"/>
      <rect x="290" y="460" width="20" height="90" fill="#FFF3C4" opacity=".45"/>
      <rect x="284" y="562" width="32" height="3" fill="#FFF3C4"/><rect x="292" y="578" width="18" height="2" fill="#FFF3C4"/>
    </g>
    <g id="ripples" stroke="#3B5A9A" stroke-width="1.2" fill="none" opacity=".55">
      <path d="M-80 520 q16 -4 32 0"/><path d="M-60 640 q16 -4 32 0"/><path d="M420 560 q16 -4 32 0"/><path d="M440 680 q16 -4 32 0"/>
      <path d="M20 480 q14 -4 28 0"/><path d="M110 520 q18 -5 36 0"/><path d="M240 560 q16 -4 32 0"/><path d="M330 500 q14 -4 28 0"/>
      <path d="M60 610 q18 -5 36 0"/><path d="M200 650 q18 -5 36 0"/><path d="M320 620 q14 -4 28 0"/><path d="M120 690 q14 -4 28 0"/>
    </g>
  </svg>

  <div id="river" aria-label="แม่น้ำ"></div>
  <canvas id="fx"></canvas>

  <header id="top">
    <img id="logo" alt="TCC" src="">
    <div id="title"><span class="t1">ลอยกระทงออนไลน์</span><span class="t2">TCC 2569</span></div>
    <div id="counter"><span id="count">0</span> ใบ</div>
  </header>

  <div id="cta">
    <button id="openForm" class="primary"><i data-lucide="sparkles"></i> ลอยกระทงของฉัน</button>
    <p id="done" hidden>คุณลอยกระทงแล้ว แตะกระทงที่เรืองแสงเพื่ออ่านคำอธิษฐานได้</p>
  </div>
</div>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form id="form" class="panel" novalidate>
    <div class="sheetHead">
      <h2 id="sheetTitle">ลอยกระทง</h2>
      <button type="button" class="icon" id="closeForm" aria-label="ปิด"><i data-lucide="x"></i></button>
    </div>
    <fieldset>
      <legend>เลือกกระทง</legend>
      <div id="styles" class="styles"></div>
      <p class="err" data-for="style"></p>
    </fieldset>
    <label>ชื่อ
      <input id="name" name="name" autocomplete="nickname" placeholder="เช่น ต้น ฝ่ายขาย" maxlength="60">
    </label>
    <p class="err" data-for="name"></p>
    <label>คำอธิษฐาน <span class="cnt"><span id="wishCount">0</span>/100</span>
      <textarea id="wish" name="wish" rows="3" placeholder="ขอให้ปีนี้มีแต่เรื่องดี ๆ" maxlength="300"></textarea>
    </label>
    <p class="err" data-for="wish"></p>
    <p class="err" id="sendErr"></p>
    <button type="submit" id="submit" class="primary wide"><i data-lucide="send"></i> ลอยเลย</button>
  </form>
</div>

<div id="pop" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="panel card">
    <div id="popArt" class="popArt"></div>
    <p id="popWish" class="popWish"></p>
    <p id="popName" class="popName"></p>
    <button type="button" class="wide" id="closePop">ปิด</button>
  </div>
</div>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script type="module" src="js/app.js?v=5"></script>
</body>
</html>
